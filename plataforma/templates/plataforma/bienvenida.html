{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido | JPP Callao</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --jp-green: #39B54A;
            --jp-red: #E31E24;
            --dark-pure: #050a06;
        }
        body {
            background-color: var(--dark-pure);
            color: #FFFFFF;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: screen;
        }
        .bg-dots {
            background-image: radial-gradient(rgba(57, 181, 74, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--jp-green);
            box-shadow: 0 0 30px rgba(57, 181, 74, 0.15);
        }
    </style>
</head>
<body class="bg-dots min-h-screen">

    <main class="flex-1 container mx-auto px-4 flex flex-col items-center justify-center py-12">
        
        <!-- Logo -->
        <div class="mb-12">
            <img src="{% static 'images/JuntosPorElPeru.png' %}" alt="JP Logo" class="h-16 w-auto">
        </div>

        <!-- Roberto Sanchez Image -->
        <div class="relative mb-12 group">
            <div class="absolute inset-0 bg-[#39B54A]/20 rounded-full blur-3xl group-hover:bg-[#39B54A]/40 transition-all duration-700"></div>
            <img src="{% static 'images/roberto.webp' %}" alt="Roberto Sanchez" 
                 class="w-56 h-56 md:w-64 md:h-64 rounded-full object-cover border-4 border-white/10 relative z-10 shadow-2xl transition-transform duration-500 group-hover:scale-105">
            <div class="absolute -bottom-4 left-1/2 -translate-x-1/2 bg-[#39B54A] text-white px-6 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest z-20 shadow-lg">
                Presidente JPP
            </div>
        </div>

        <!-- Welcome Text -->
        <div class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold mb-2 tracking-tighter uppercase" style="font-family: 'Plus Jakarta Sans', sans-serif;">
                Sistema de <span class="text-[#39B54A]">Personeros</span>
            </h1>
            <p class="text-gray-500 text-sm md:text-base uppercase tracking-[0.4em] font-bold">
                Callao Unido 2026
            </p>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col sm:flex-row gap-6 w-full max-w-lg">
            
            <!-- Login Button -->
            <a href="{% url 'personeros:login' %}" class="flex-1 glass-card p-6 rounded-2xl flex flex-col items-center group text-center">
                <div class="w-12 h-12 bg-white/5 rounded-xl flex items-center justify-center mb-4 border border-white/10 group-hover:bg-[#39B54A]/20 group-hover:border-[#39B54A]/30 transition-all">
                    <i data-lucide="log-in" class="w-6 h-6 text-gray-400 group-hover:text-[#39B54A]"></i>
                </div>
                <span class="text-lg font-bold uppercase tracking-wider">Acceso</span>
                <span class="text-[10px] text-gray-500 font-medium uppercase tracking-widest mt-1">Administradores</span>
            </a>

            <!-- Register Button -->
            <a href="{% url 'personeros:registro_publico' %}" class="flex-1 glass-card p-6 rounded-2xl flex flex-col items-center group text-center">
                <div class="w-12 h-12 bg-[#39B54A]/10 rounded-xl flex items-center justify-center mb-4 border border-[#39B54A]/20 group-hover:bg-[#39B54A]/30 transition-all">
                    <i data-lucide="user-plus" class="w-6 h-6 text-[#39B54A]"></i>
                </div>
                <span class="text-lg font-bold uppercase tracking-wider">Registro</span>
                <span class="text-[10px] text-gray-500 font-medium uppercase tracking-widest mt-1">Nuevos Personeros</span>
            </a>

        </div>

    </main>

    <!-- Footer -->
    <footer class="p-8 text-center">
        <p class="text-gray-700 text-[10px] uppercase tracking-widest font-bold">
            &copy; 2026 Juntos por el Perú - Callao. Defendiendo la Democracia.
        </p>
    </footer>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
